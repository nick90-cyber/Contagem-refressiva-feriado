<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva para Feriados</title>
    <!-- Modern Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #6a7dff;
            --secondary: #4c5edb;
            --accent: #ff6347;
            --bg-dark: rgba(0, 0, 0, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
        }

        .image-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.6);
        }

        body {
            font-family: 'Roboto', sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
        }

        h2 {
            font-weight: 300;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 1px;
        }

        .year-nav {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            padding: 12px 28px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover {
            background: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(106, 125, 255, 0.3);
            border-color: transparent;
        }

        button.active {
            background: var(--primary);
            box-shadow: 0 5px 15px rgba(106, 125, 255, 0.4);
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .holiday-list {
            display: none;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        .holiday-list.active {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .holiday-item {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 25px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .holiday-item:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.15);
        }

        .holiday-info {
            text-align: left;
        }

        .holiday-name {
            font-size: 1.4rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            display: block;
            margin-bottom: 5px;
        }

        .holiday-date {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .countdown {
            text-align: right;
            min-width: 200px;
        }

        .timer {
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            color: var(--accent);
            font-weight: 600;
            display: block;
        }

        .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        hr {
            width: 100px;
            border: none;
            height: 4px;
            background: var(--accent);
            margin: 0 auto 30px;
            border-radius: 2px;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            .holiday-item {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }

            .holiday-info {
                text-align: center;
            }

            .countdown {
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="image-container">
        <img src="images/background.jpg" alt="Background">
    </div>

    <header>
        <h1>Contagem Regressiva</h1>
        <h2>Ferramentas e Aplicativos Online</h2>
    </header>

    <hr>

    <div class="year-nav">
        <button onclick="changeYear(2024)" id="btn-2024">2024</button>
        <button onclick="changeYear(2025)" id="btn-2025">2025</button>
        <button onclick="changeYear(2026)" id="btn-2026">2026</button>
        <button onclick="changeYear(2027)" id="btn-2027">2027</button>
    </div>

    <div class="container" id="holiday-container">
        <!-- Holiday lists will be injected here -->
    </div>

    <div class="controls">
        <button onclick="startAll()">Iniciar Tudo</button>
        <button onclick="pauseAll()">Pausar</button>
        <button onclick="resetAll()">Resetar</button>
    </div>

    <script>
        const holidaysData = {
            2024: [
                { name: 'Ano Novo', date: '2024-01-01' },
                { name: 'Carnaval', date: '2024-02-13' },
                { name: 'Sexta-feira Santa', date: '2024-03-29' },
                { name: 'Tiradentes', date: '2024-04-21' },
                { name: 'Dia do Trabalho', date: '2024-05-01' },
                { name: 'Corpus Christi', date: '2024-05-30' },
                { name: 'Independência', date: '2024-09-07' },
                { name: 'Nossa Srª Aparecida', date: '2024-10-12' },
                { name: 'Finados', date: '2024-11-02' },
                { name: 'Proclamação da República', date: '2024-11-15' },
                { name: 'Consciência Negra', date: '2024-11-20' },
                { name: 'Natal', date: '2024-12-25' }
            ],
            2025: [
                { name: 'Ano Novo', date: '2025-01-01' },
                { name: 'Carnaval', date: '2025-03-04' },
                { name: 'Sexta-feira Santa', date: '2025-04-18' },
                { name: 'Tiradentes', date: '2025-04-21' },
                { name: 'Dia do Trabalho', date: '2025-05-01' },
                { name: 'Corpus Christi', date: '2025-06-19' },
                { name: 'Independência', date: '2025-09-07' },
                { name: 'Nossa Srª Aparecida', date: '2025-10-12' },
                { name: 'Finados', date: '2025-11-02' },
                { name: 'Proclamação da República', date: '2025-11-15' },
                { name: 'Consciência Negra', date: '2025-11-20' },
                { name: 'Natal', date: '2025-12-25' }
            ],
            2026: [
                { name: 'Ano Novo', date: '2026-01-01' },
                { name: 'Carnaval', date: '2026-02-17' },
                { name: 'Tiradentes', date: '2026-04-21' },
                { name: 'Dia do Trabalho', date: '2026-05-01' },
                { name: 'Independência', date: '2026-09-07' },
                { name: 'Nossa Srª Aparecida', date: '2026-10-12' },
                { name: 'Natal', date: '2026-12-25' }
            ],
            2027: [
                { name: 'Ano Novo', date: '2027-01-01' },
                { name: 'Carnaval', date: '2027-02-09' },
                { name: 'Tiradentes', date: '2027-04-21' },
                { name: 'Dia do Trabalho', date: '2027-05-01' },
                { name: 'Independência', date: '2027-09-07' },
                { name: 'Nossa Srª Aparecida', date: '2027-10-12' },
                { name: 'Natal', date: '2027-12-25' }
            ]
        };

        let intervals = {};
        let currentYear = new Date().getFullYear();
        if (!holidaysData[currentYear]) currentYear = 2024;

        function init() {
            const container = document.getElementById('holiday-container');

            Object.keys(holidaysData).forEach(year => {
                const list = document.createElement('div');
                list.id = `list-${year}`;
                list.className = 'holiday-list';

                holidaysData[year].forEach((holiday, idx) => {
                    const item = document.createElement('div');
                    item.className = 'holiday-item';
                    item.innerHTML = `
                        <div class="holiday-info">
                            <span class="holiday-name">${holiday.name}</span>
                            <span class="holiday-date">${formatDate(holiday.date)}</span>
                        </div>
                        <div class="countdown">
                            <span class="label">Faltam</span>
                            <span class="timer" id="timer-${year}-${idx}">--d --h --m --s</span>
                        </div>
                    `;
                    list.appendChild(item);
                });

                container.appendChild(list);
            });

            changeYear(2025); // Start with 2025 as it's the closest/future for some
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
        }

        function changeYear(year) {
            currentYear = year;
            document.querySelectorAll('.holiday-list').forEach(l => l.classList.remove('active'));
            document.querySelectorAll('.year-nav button').forEach(b => b.classList.remove('active'));

            document.getElementById(`list-${year}`).classList.add('active');
            document.getElementById(`btn-${year}`).classList.add('active');

            startAll();
        }

        function updateTimer(year, idx) {
            const target = new Date(holidaysData[year][idx].date + 'T00:00:00');
            const now = new Date();
            const diff = target - now;
            const el = document.getElementById(`timer-${year}-${idx}`);

            if (diff <= 0) {
                el.textContent = "Hoje é o dia!";
                el.style.color = "#4CAF50";
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            el.textContent = `${d}d ${h}h ${m}s ${s}s`;
        }

        function startAll() {
            pauseAll();
            holidaysData[currentYear].forEach((_, idx) => {
                const key = `${currentYear}-${idx}`;
                updateTimer(currentYear, idx);
                intervals[key] = setInterval(() => updateTimer(currentYear, idx), 1000);
            });
        }

        function pauseAll() {
            Object.values(intervals).forEach(clearInterval);
            intervals = {};
        }

        function resetAll() {
            pauseAll();
            document.querySelectorAll('.timer').forEach(el => el.textContent = '--d --h --m --s');
        }

        window.onload = init;
    </script>
</body>

</html>
