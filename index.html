<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva para Feriados</title>
    <!-- Modern Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@300;400;500&display=swap"
        rel="stylesheet">
    <!-- Modularized Design Patterns -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="image-container">
        <img src="images/background.jpg" alt="Background">
    </div>

    <header>
        <h1>Contagem Regressiva</h1>
        <h2>Ferramentas e Aplicativos Online</h2>
    </header>

    <hr>

    <div class="search-wrapper">
        <div class="search-container" id="search-container">
            <svg class="search-icon" onclick="app.toggleSearch()" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" placeholder="Buscar feriado..."
                oninput="app.filterHolidays(this.value)">
        </div>
    </div>

    <nav class="year-nav">
        <button id="btn-2024">2024</button>
        <button id="btn-2025">2025</button>
        <button id="btn-2026">2026</button>
        <button id="btn-2027">2027</button>
    </nav>

    <main class="container" id="holiday-container">
        <!-- Holiday lists will be injected here via script.js -->
    </main>

    <div class="controls">
        <button onclick="startAll()">Iniciar Tudo</button>
        <button onclick="pauseAll()">Pausar</button>
        <button onclick="resetAll()">Resetar</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
